<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="在线哈希工具，支持 MD5、SHA-1、SHA-256、SHA-512 计算，纯前端运行。">
  <meta name="keywords" content="哈希, MD5, SHA1, SHA256, SHA512, 校验, 在线工具">
  <meta name="author" content="军舰">
  <meta name="date" content="2026-06-18">
  <title>哈希计算工具</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch(e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #78716c;
      --border: #e7e5e4; --accent: #0ea5e9; --accent-hover: #0284c7; --error: #dc2626;
    }
    html.dark {
      --bg: #0c0a09; --panel: #1c1917; --text: #f5f5f4; --muted: #a8a29e;
      --border: #292524; --accent: #38bdf8; --accent-hover: #0ea5e9; --error: #f87171;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
      background: var(--bg); color: var(--text);
    }
    .app-header { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:0.875rem 1.25rem; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--panel); z-index:10; }
    .app-header h1 { font-size:1.125rem; margin:0; font-weight:600; }
    .icon-btn { border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:0.5rem; width:2.25rem; height:2.25rem; cursor:pointer; font-size:1.1rem; }
    .icon-btn:hover { background:var(--bg); }
    .wrap { max-width: 880px; margin:0 auto; padding:1.25rem; display:flex; flex-direction:column; gap:1rem; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:0.75rem; padding:1rem; }
    label { font-size:0.875rem; color:var(--muted); display:block; margin-bottom:0.375rem; }
    textarea, input, select { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:0.5rem; padding:0.625rem; font-size:0.9rem; font-family:inherit; width:100%; }
    textarea { resize: vertical; min-height: 140px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; line-height:1.6; }
    textarea:focus, input:focus, select:focus { outline:2px solid var(--accent); outline-offset:1px; }
    button.btn { border:1px solid var(--border); background:var(--panel); color:var(--text); padding:0.5rem 0.875rem; border-radius:0.375rem; font-size:0.875rem; cursor:pointer; }
    button.btn:hover { background:var(--bg); }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    button.primary:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
    .row { display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; }
    .status { font-size:0.85rem; color:var(--muted); min-height:1.25rem; }
    .status.error { color:var(--error); }
    .out { display:grid; grid-template-columns:1fr; gap:0.5rem; }
    .hashline { display:flex; gap:0.75rem; align-items:center; font-family:ui-monospace, monospace; font-size:0.85rem; }
    .hashline .name { width:5.5rem; color:var(--muted); flex-shrink:0; }
    .hashline .val { flex:1; word-break:break-all; }
    .hashline button { padding:0.25rem 0.5rem; font-size:0.75rem; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/blueimp-md5@2.19.0/js/md5.min.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>哈希计算工具</h1>
    <button class="icon-btn" id="themeToggle" title="切换主题">🌓</button>
  </header>

  <div class="wrap">
    <div class="card">
      <label for="input">输入文本</label>
      <textarea id="input" placeholder="输入需要计算哈希的内容...">Hello, 世界!</textarea>
      <div class="row" style="margin-top:.75rem">
        <button class="btn primary" id="btnAll">计算全部</button>
        <button class="btn" id="btnClear">清空</button>
        <span class="status" id="status"></span>
      </div>
    </div>

    <div class="card">
      <label>计算结果</label>
      <div class="out" id="out"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const inputEl = $('input'), outEl = $('out'), statusEl = $('status');
    function setStatus(msg, isError){ statusEl.textContent = msg || ''; statusEl.classList.toggle('error', !!isError); }

    async function sha(message, algo){
      const data = new TextEncoder().encode(message);
      const buf = await crypto.subtle.digest(algo, data);
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function copy(text){
      navigator.clipboard.writeText(text).then(
        () => setStatus('已复制 ' + text.slice(0,8) + '…'),
        () => setStatus('复制失败', true)
      );
    }

    async function computeAll(){
      const text = inputEl.value;
      if (!text) { outEl.innerHTML = ''; setStatus('请输入内容'); return; }
      const algos = [
        ['MD5', () => (window.md5 ? md5(text) : Promise.reject(new Error('MD5 库未加载')))],
        ['SHA-1', () => sha(text, 'SHA-1')],
        ['SHA-256', () => sha(text, 'SHA-256')],
        ['SHA-512', () => sha(text, 'SHA-512')],
      ];
      outEl.innerHTML = algos.map(([n]) => '<div class="hashline"><span class="name">'+n+'</span><span class="val" id="v-'+n+'">计算中…</span><button class="btn" data-c="'+n+'">复制</button></div>').join('');
      for (const [name, fn] of algos){
        try {
          const r = await fn();
          const vEl = $('v-' + name);
          if (vEl) vEl.textContent = r;
        } catch(e){
          const vEl = $('v-' + name);
          if (vEl) vEl.textContent = '错误：' + e.message;
        }
      }
      outEl.querySelectorAll('button[data-c]').forEach(b => {
        b.addEventListener('click', () => {
          const v = $('v-' + b.dataset.c).textContent;
          if (v && !v.startsWith('错误') && v !== '计算中…') copy(v);
        });
      });
      setStatus('计算完成');
    }

    $('btnAll').addEventListener('click', computeAll);
    $('btnClear').addEventListener('click', () => { inputEl.value=''; outEl.innerHTML=''; setStatus(''); });
    computeAll();

    $('themeToggle').addEventListener('click', () => {
      const root = document.documentElement;
      root.classList.toggle('dark');
      try { localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light'); } catch (e) {}
    });
  </script>
</body>
</html>
