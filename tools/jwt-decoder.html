<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="解析 JWT（JSON Web Token），拆解 Header 与 Payload，自动识别过期时间，纯前端运行。">
  <meta name="keywords" content="JWT, Token, 解析, 解码, Header, Payload">
  <meta name="author" content="军舰">
  <meta name="date" content="2026-06-18">
  <title>JWT 解析器</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch(e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #78716c;
      --border: #e7e5e4; --accent: #0ea5e9; --accent-hover: #0284c7; --error: #dc2626;
    }
    html.dark {
      --bg: #0c0a09; --panel: #1c1917; --text: #f5f5f4; --muted: #a8a29e;
      --border: #292524; --accent: #38bdf8; --accent-hover: #0ea5e9; --error: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh;
    }
    .wrap { flex: 1; display: flex; flex-direction: column; gap: 1rem; padding: 1rem; max-width: 900px; margin: 0 auto; }
    textarea {
      width: 100%; min-height: 120px; resize: vertical; border: 1px solid var(--border);
      border-radius: 0.5rem; padding: 0.875rem; font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.9rem; line-height: 1.5; background: var(--panel); color: var(--text);
    }
    textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    button {
      border: 1px solid var(--border); background: var(--panel); color: var(--text);
      padding: 0.5rem 0.875rem; border-radius: 0.375rem; font-size: 0.875rem; cursor: pointer;
    }
    button:hover { background: var(--bg); border-color: var(--muted); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card { border: 1px solid var(--border); border-radius: 0.5rem; padding: 1rem; background: var(--panel); }
    .card h3 { margin: 0 0 0.5rem; font-size: 0.95rem; }
    pre { white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.875rem; line-height: 1.5; margin: 0; }
    .status { font-size: 0.875rem; color: var(--muted); }
    .status.error { color: var(--error); }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
    .badge.ok { background: #dcfce7; color: #16a34a; }
    .badge.expired { background: #fee2e2; color: #dc2626; }
    html.dark .badge.ok { background: #14331f; color: #4ade80; }
    html.dark .badge.expired { background: #3a1d1d; color: #f87171; }
  </style>
</head>
<body>
  <div class="wrap">
    <textarea id="token" placeholder="粘贴 JWT（xxx.yyy.zzz）..."></textarea>
    <div class="toolbar">
      <button class="primary" id="decode">解析</button>
      <button id="sample">填入示例</button>
      <button id="clear">清空</button>
      <span id="expBadge"></span>
      <span class="status" id="status"></span>
    </div>
    <div class="grid">
      <div class="card"><h3>Header</h3><pre id="header">—</pre></div>
      <div class="card"><h3>Payload</h3><pre id="payload">—</pre></div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const SAMPLE = { alg: 'HS256', typ: 'JWT' };
    const SPAY = { sub: '1234567890', name: '军舰', iat: 1516239022, exp: Math.floor(Date.now()/1000) + 3600 };
    function b64urlDecode(s) {
      s = s.replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      const bin = atob(s);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }
    function pretty(obj) { return JSON.stringify(obj, null, 2); }

    $('decode').onclick = () => {
      const t = $('token').value.trim();
      const parts = t.split('.');
      if (parts.length < 2) { $('status').textContent = '无效的 JWT（至少需要 Header.Payload）'; $('status').classList.add('error'); return; }
      try {
        const header = JSON.parse(b64urlDecode(parts[0]));
        const payload = JSON.parse(b64urlDecode(parts[1]));
        $('header').textContent = pretty(header);
        // humanize time fields
        const p = {...payload};
        ['iat','exp','nbf'].forEach(k => {
          if (typeof p[k] === 'number') p[k] = p[k] + '  (' + new Date(p[k]*1000).toLocaleString('zh-CN',{hour12:false}) + ')';
        });
        $('payload').textContent = pretty(p);
        $('status').classList.remove('error');
        $('status').textContent = '解析成功';
        const badge = $('expBadge');
        if (typeof payload.exp === 'number') {
          const now = Math.floor(Date.now()/1000);
          if (payload.exp < now) { badge.innerHTML = '<span class="badge expired">已过期</span>'; }
          else { badge.innerHTML = '<span class="badge ok">有效</span>'; }
        } else { badge.innerHTML = ''; }
      } catch(e) {
        $('status').textContent = '解析失败：' + e.message; $('status').classList.add('error');
      }
    };
    $('sample').onclick = () => {
      const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      $('token').value = enc(SAMPLE) + '.' + enc(SPAY) + '.sig';
      $('decode').click();
    };
    $('clear').onclick = () => { $('token').value=''; $('header').textContent='—'; $('payload').textContent='—'; $('status').textContent=''; $('expBadge').innerHTML=''; };
  </script>
</body>
</html>
