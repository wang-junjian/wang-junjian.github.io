<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="生成高强度密码并评估强度，支持易记助记词口令，纯前端运行。">
  <meta name="keywords" content="密码生成器, 随机密码, 强度, 助记词, 安全">
  <meta name="author" content="军舰">
  <meta name="date" content="2026-06-18">
  <title>密码生成器</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch(e) {}
    })();
  </script>
  <style>
    :root { --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #78716c; --border: #e7e5e4; --accent: #0ea5e9; --ok: #16a34a; --warn: #d97706; --err: #dc2626; }
    html.dark { --bg: #0c0a09; --panel: #1c1917; --text: #f5f5f4; --muted: #a8a29e; --border: #292524; --accent: #38bdf8; --ok: #4ade80; --warn: #fbbf24; --err: #f87171; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
    .wrap { flex: 1; display: flex; flex-direction: column; gap: 1rem; padding: 1rem; max-width: 640px; margin: 0 auto; width: 100%; }
    .card { border: 1px solid var(--border); border-radius: 0.6rem; padding: 1.2rem; background: var(--panel); }
    .out { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1.3rem; word-break: break-all;
      padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; background: var(--bg); min-height: 3rem; }
    .toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }
    button { border: 1px solid var(--border); background: var(--panel); color: var(--text);
      padding: 0.5rem 0.875rem; border-radius: 0.375rem; font-size: 0.875rem; cursor: pointer; }
    button:hover { background: var(--bg); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; margin: 0.4rem 0; }
    input[type=range] { flex: 1; }
    .meter { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; margin-top: 0.5rem; }
    .meter > i { display: block; height: 100%; width: 0; transition: width 0.2s; }
    .strength { font-size: 0.9rem; margin-top: 0.4rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="out" id="out">点击生成</div>
      <div class="meter"><i id="bar"></i></div>
      <div class="strength" id="strength"></div>
      <div class="toolbar">
        <button class="primary" id="gen">生成密码</button>
        <button id="copy">复制</button>
      </div>
      <div style="margin-top:1rem">
        <label>长度 <span id="lenVal">16</span>
          <input type="range" id="len" min="4" max="64" value="16">
        </label>
        <label><input type="checkbox" id="upper" checked> 大写字母 (A-Z)</label>
        <label><input type="checkbox" id="lower" checked> 小写字母 (a-z)</label>
        <label><input type="checkbox" id="num" checked> 数字 (0-9)</label>
        <label><input type="checkbox" id="sym" checked> 符号 (!@#$%^&*)</label>
      </div>
    </div>
    <div class="card">
      <h3 style="margin:0 0 0.5rem;font-size:1rem">易记助记词口令</h3>
      <div class="toolbar">
        <button id="genPhrase">生成助记口令</button>
        <button id="copyPhrase">复制</button>
      </div>
      <div class="out" id="phrase" style="margin-top:0.75rem;font-size:1.1rem"></div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const WORDS=['river','tiger','moon','cloud','stone','light','forest','ocean','mountain','ember','frost','echo','willow','thunder','crystal','shadow','pioneer','harbor','compass','lantern'];
    function rnd(n){ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n; }
    function gen(){
      const chars=[];
      if($('upper').checked) chars.push('ABCDEFGHIJKLMNOPQRSTUVWXYZ');
      if($('lower').checked) chars.push('abcdefghijklmnopqrstuvwxyz');
      if($('num').checked) chars.push('0123456789');
      if($('sym').checked) chars.push('!@#$%^&*()-_=+');
      if(!chars.length){ $('out').textContent='请至少选择一类字符'; return; }
      const all=chars.join(''); const len=+$('len').value;
      let s=''; const a=new Uint32Array(len); crypto.getRandomValues(a);
      for(let i=0;i<len;i++) s+=all[a[i]%all.length];
      $('out').textContent=s; evalStrength(s);
    }
    function evalStrength(s){
      let pool=0;
      if(/[a-z]/.test(s))pool+=26; if(/[A-Z]/.test(s))pool+=26; if(/[0-9]/.test(s))pool+=10; if(/[^a-zA-Z0-9]/.test(s))pool+=20;
      const bits=Math.log2(pool||1)*s.length;
      const bar=$('bar'); let label,color;
      if(bits<40){ label='弱'; color='var(--err)'; }
      else if(bits<60){ label='中'; color='var(--warn)'; }
      else if(bits<80){ label='强'; color='var(--accent)'; }
      else { label='非常强'; color='var(--ok)'; }
      bar.style.width=Math.min(100,bits/1.2)+'%'; bar.style.background=color;
      $('strength').textContent=`强度：${label}（约 ${Math.round(bits)} bit 熵）`;
    }
    function genPhrase(){
      const n=4; let parts=[]; for(let i=0;i<n;i++) parts.push(WORDS[rnd(WORDS.length)]);
      const sep=['-','.','_'][rnd(3)];
      const p=parts.join(sep)+(rnd(90)+10);
      $('phrase').textContent=p;
    }
    $('len').oninput=()=>$('lenVal').textContent=$('len').value;
    $('gen').onclick=gen;
    $('genPhrase').onclick=genPhrase;
    $('copy').onclick=()=>navigator.clipboard.writeText($('out').textContent);
    $('copyPhrase').onclick=()=>navigator.clipboard.writeText($('phrase').textContent);
    gen();
  </script>
</body>
</html>
