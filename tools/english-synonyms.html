<meta name="keywords" content="同义词聚类, 高中英语, 高考词汇, 词汇记忆, 单词发音, 自测模式, DeepSeek-V4-Flash">

<style>

:root{
  --bg:#0a0a0a; --bg2:#101010; --card:#161616; --card2:#1d1d1d;
  --text:#f0f0f0; --dim:#989898; --faint:#6a6a6a;
  --acid:#ccff00; --magenta:#ff2d95; --cyan:#00e5ff;
  --line:#272727; --line2:#333;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--acid);color:#000}

/* ===== Header ===== */
header{
  position:sticky; top:0; z-index:50;
  background:rgba(10,10,10,.86); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:14px 24px 12px;
}
.h-top{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:10px; min-width:0}
.brand h1{
  font-size:22px; font-weight:800; letter-spacing:-.02em;
  white-space:nowrap;
}
.brand h1 .accent{color:var(--acid)}
.brand .sub{color:var(--faint); font-size:12px; letter-spacing:.06em; white-space:nowrap}
.h-stats{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.stat{
  font-size:12px; color:var(--dim); background:var(--card);
  border:1px solid var(--line); padding:4px 10px; border-radius:999px;
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.stat b{color:var(--acid); font-weight:700}
.stat.mag b{color:var(--magenta)}
.h-controls{display:flex; gap:8px; align-items:center}
.search-box{position:relative}
.search-box input{
  width:230px; background:var(--card); color:var(--text);
  border:1px solid var(--line2); border-radius:10px;
  padding:8px 12px 8px 34px; font-size:14px; outline:none;
  transition:border-color .15s, width .2s;
}
.search-box input:focus{border-color:var(--acid); width:280px}
.search-box .ico{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--faint); font-size:14px}
.btn{
  background:var(--card); color:var(--text); border:1px solid var(--line2);
  border-radius:10px; padding:8px 14px; font-size:13px; font-weight:600;
  cursor:pointer; transition:all .15s; white-space:nowrap;
}
.btn:hover{border-color:var(--acid); color:var(--acid)}
.btn.active{background:var(--acid); color:#000; border-color:var(--acid)}
.btn .dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--magenta); margin-right:6px; vertical-align:1px}
.voice-sel{
  background:var(--card); color:var(--text); border:1px solid var(--line2);
  border-radius:10px; padding:8px 10px; font-size:12.5px; outline:none;
  cursor:pointer; max-width:215px; min-width:140px;
}
.voice-sel:focus{border-color:var(--acid)}
.voice-sel option{background:#1d1d1d; color:var(--text)}

/* ===== 主题导航 ===== */
.navbar{
  display:flex; gap:8px; overflow-x:auto; padding:12px 24px 2px;
  scrollbar-width:thin; scrollbar-color:var(--line2) transparent;
}
.navbar::-webkit-scrollbar{height:6px}
.navbar::-webkit-scrollbar-thumb{background:var(--line2); border-radius:3px}
.nav-chip{
  flex:0 0 auto; font-size:12px; color:var(--dim);
  background:var(--card); border:1px solid var(--line);
  border-radius:999px; padding:5px 12px; cursor:pointer;
  transition:all .15s; white-space:nowrap;
}
.nav-chip:hover{color:var(--acid); border-color:var(--acid)}
.nav-chip b{color:var(--text); font-weight:600; margin-right:4px}
.nav-chip span{color:var(--faint); font-size:11px}

/* ===== 主网格 ===== */
main{padding:20px 24px 60px; max-width:1560px; margin:0 auto}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:16px 18px; transition:border-color .15s, transform .1s;
  scroll-margin-top:120px;
}
.card:hover{border-color:var(--line2)}
.card-head{display:flex; align-items:baseline; gap:10px; margin-bottom:12px}
.card-head .t{font-size:16px; font-weight:800; letter-spacing:-.01em}
.card-head .t::before{content:""; display:inline-block; width:8px; height:8px; border-radius:2px; background:var(--magenta); margin-right:8px}
.card-head .cnt{font-size:11px; color:var(--faint); margin-left:auto; font-variant-numeric:tabular-nums}
.card-head .cnt b{color:var(--acid)}
.words{display:flex; flex-wrap:wrap; gap:6px}
.w-chip{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--bg2); border:1px solid var(--line);
  border-radius:8px; padding:4px 9px; font-size:13px;
  cursor:pointer; transition:all .12s; user-select:none;
}
.w-chip:hover{border-color:var(--acid); transform:translateY(-1px)}
.w-chip .en{font-weight:600; color:var(--text)}
.w-chip .cn{color:var(--dim); font-size:12px}
.w-chip .sound{
  font-size:11px; color:var(--faint); opacity:0; transition:opacity .15s;
  font-style:normal;
}
.w-chip:hover .sound{opacity:1; color:var(--acid)}
.w-chip.revealed{border-color:var(--acid); background:rgba(204,255,0,.06)}
.w-chip.revealed .cn{color:var(--acid)}

/* 自测模式：默认隐藏释义 */
body.quiz .w-chip .cn{display:none}
body.quiz .w-chip .en::after{content:" ·"; color:var(--faint)}

/* ===== 未归类 ===== */
.others{margin-top:40px; border-top:1px dashed var(--line); padding-top:20px}
.others summary{
  cursor:pointer; font-size:14px; font-weight:700; color:var(--dim);
  list-style:none; display:flex; align-items:center; gap:8px;
}
.others summary::-webkit-details-marker{display:none}
.others summary::before{content:"▸"; transition:transform .2s; color:var(--magenta)}
.others[open] summary::before{transform:rotate(90deg)}
.others summary .cnt{font-size:11px; color:var(--faint); font-weight:400}
.others-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:6px; margin-top:14px;
}
.others-grid .w-chip{font-size:12px; padding:3px 8px}

/* ===== 空态 ===== */
.empty{text-align:center; padding:80px 20px; color:var(--faint)}
.empty .big{font-size:42px; margin-bottom:10px}

/* ===== 提示条 ===== */
.hint{
  display:flex; gap:16px; align-items:center; flex-wrap:wrap;
  background:var(--bg2); border:1px solid var(--line);
  border-radius:var(--r); padding:10px 16px; margin:16px 24px 0;
  font-size:12px; color:var(--dim);
}
.hint b{color:var(--acid)}
.hint .k{color:var(--magenta); font-weight:700}

footer{padding:30px 24px 50px; text-align:center; color:var(--faint); font-size:12px}

@media (max-width:720px){
  header{padding:12px 14px}
  .search-box input{width:150px}
  .search-box input:focus{width:180px}
  main{padding:16px 14px 40px}
  .grid{grid-template-columns:1fr}
  .brand h1{font-size:18px}
  .hint{margin:12px 14px 0}
}

</style>

</div>

<main>

": "工人"}, {"w": "world", "cn": "世界"}, {"w": "worth", "cn": "值得的"}, {"w": "would", "cn": "将会"}, {"w": "wound", "cn": "伤口"}, {"w": "writer", "cn": "作家"}, {"w": "yard", "cn": "院子"}, {"w": "year", "cn": "年"}, {"w": "yellow", "cn": "黄色的"}, {"w": "yes", "cn": "是"}, {"w": "yesterday", "cn": "昨天"}, {"w": "yet", "cn": "还"}, {"w": "you", "cn": "你"}, {"w": "young", "cn": "年轻的"}, {"w": "your", "cn": "你的"}, {"w": "yours", "cn": "你的(名词性物主代词)"}, {"w": "yourself", "cn": "你自己"}, {"w": "youth", "cn": "青年"}, {"w": "zero", "cn": "零"}, {"w": "zoo", "cn": "动物园"}]};
  var total = DATA.total, groups = DATA.groups, unmatched = DATA.unmatched;
  var grid = document.getElementById('grid');
  var navbar = document.getElementById('navbar');
  var q = document.getElementById('q');
  var btnQuiz = document.getElementById('btnQuiz');
  var btnBrowse = document.getElementById('btnBrowse');
  var othersGrid = document.getElementById('othersGrid');
  var mode = 'browse'; // browse | quiz

  // 统计
  var matchedSet = {};
  groups.forEach(function(g){ g.words.forEach(function(w){ matchedSet[w.w.toLowerCase()] = 1; }); });
  var matched = Object.keys(matchedSet).length;
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-groups').textContent = groups.length;
  document.getElementById('s-matched').textContent = matched;
  document.getElementById('s-rate').textContent = (matched/total*100).toFixed(1) + '%';
  document.getElementById('s-others').textContent = '(' + unmatched.length + ' 词)';

  // ===== 发音（跨平台语音优选） =====
  var voiceSel = document.getElementById('voiceSel');
  var currentVoice = null;
  // 各平台优先语音名单（按质量/自然度排序，子串匹配，不分大小写）
  var VOICE_PREF = [
    // macOS 高质量
    'Samantha', 'Ava', 'Allison', 'Susan', 'Karen', 'Moira', 'Tessa', 'Daniel', 'Serena',
    // Windows 10/11（Microsoft 神经网络）
    'Microsoft Aria', 'Microsoft Ana', 'Microsoft Guy', 'Microsoft Jenny', 'Microsoft Michelle',
    'Microsoft Zira', 'Microsoft David', 'Microsoft Mark', 'Microsoft Christopher', 'Microsoft Steffan',
    // Chrome / 在线
    'Google US English', 'Google UK English Female', 'Google UK English Male',
    // 兜底常见
    'English US', 'English United States', 'en-US', 'en_GB'
  ];
  var langOk = function(v){ return v && v.lang && /^en(-|_)/i.test(v.lang); };

  function pickBestVoice(voices){
    var i, j;
    for(i = 0; i < VOICE_PREF.length; i++){
      var pref = VOICE_PREF[i].toLowerCase();
      for(j = 0; j < voices.length; j++){
        if(langOk(voices[j]) && voices[j].name.toLowerCase().indexOf(pref) !== -1){
          return voices[j];
        }
      }
    }
    // 回退：任意英语语音
    for(j = 0; j < voices.length; j++){
      if(langOk(voices[j])) return voices[j];
    }
    return voices[0] || null;
  }

  function fillVoiceSelect(voices){
    var prev = voiceSel.dataset.cur || '';
    voiceSel.innerHTML = '<option value="">✨ 自动（推荐）</option>';
    var en = voices.filter(langOk);
    var names = {};
    en.forEach(function(v){ names[v.name + '|' + v.lang] = v; });
    Object.keys(names).sort().forEach(function(k){
      var v = names[k];
      var o = document.createElement('option');
      o.value = v.name + '::' + v.lang;
      o.textContent = v.name + ' — ' + v.lang;
      voiceSel.appendChild(o);
    });
    if(prev) voiceSel.value = prev;
  }

  function initVoices(){
    var voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    if(!voices.length){
      // Safari/Chrome 语音异步加载
      if('onvoiceschanged' in (window.speechSynthesis || {})){
        speechSynthesis.onvoiceschanged = function(){
          var vs = speechSynthesis.getVoices();
          fillVoiceSelect(vs);
          currentVoice = pickBestVoice(vs);
          if(localStorage.getItem('wbVoice')) applyStoredVoice(vs);
        };
        speechSynthesis.onvoiceschanged();
      }
      return;
    }
    fillVoiceSelect(voices);
    currentVoice = pickBestVoice(voices);
    if(localStorage.getItem('wbVoice')) applyStoredVoice(voices);
  }

  function applyStoredVoice(voices){
    var stored = localStorage.getItem('wbVoice');
    if(!stored) return;
    for(var i = 0; i < voices.length; i++){
      if(voices[i].name + '::' + voices[i].lang === stored){
        voiceSel.value = stored;
        currentVoice = voices[i];
        break;
      }
    }
  }

  voiceSel.onchange = function(){
    var val = voiceSel.value;
    if(!val){
      var vs = speechSynthesis.getVoices();
      currentVoice = pickBestVoice(vs);
      localStorage.removeItem('wbVoice');
      return;
    }
    var parts = val.split('::');
    var vs = speechSynthesis.getVoices();
    for(var i = 0; i < vs.length; i++){
      if(vs[i].name === parts[0] && vs[i].lang === parts[1]){
        currentVoice = vs[i];
        localStorage.setItem('wbVoice', val);
        break;
      }
    }
  };

  function speak(word){
    if(!('speechSynthesis' in window)) return;
    var text = word.replace(/\(.*?\)/g,'').replace(/[\/].*$/,'').trim();
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.9;
    if(currentVoice){
      u.voice = currentVoice;
      u.lang = currentVoice.lang || u.lang;
    }
    speechSynthesis.speak(u);
  }
  initVoices();

  // 搜索过滤
  function filter(){
    var kw = q.value.trim().toLowerCase();
    var visible = 0;
    Array.prototype.forEach.call(grid.children, function(card){
      var hit = !kw || card.dataset.search.indexOf(kw) !== -1;
      card.style.display = hit ? '' : 'none';
      if(hit) visible++;
    });
    // 导航高亮
    Array.prototype.forEach.call(navbar.children, function(chip){
      var cid = chip.dataset.id;
      var card = document.getElementById('card-' + cid);
      chip.style.display = (card && card.style.display !== 'none') ? '' : 'none';
    });
    var empty = document.getElementById('empty');
    if(visible === 0 && !empty){
      empty = document.createElement('div');
      empty.className = 'empty'; empty.id = 'empty';
      empty.innerHTML = '<div class="big">🔍</div><div>没有匹配的单词或主题</div>';
      grid.appendChild(empty);
    } else if(visible > 0 && empty){ empty.remove(); }
  }

  // 渲染导航
  function renderNav(){
    navbar.innerHTML = '';
    groups.forEach(function(g, i){
      var chip = document.createElement('div');
      chip.className = 'nav-chip';
      chip.dataset.id = i;
      chip.innerHTML = '<b>' + g.name + '</b><span>' + g.words.length + '</span>';
      chip.onclick = function(){
        var card = document.getElementById('card-' + i);
        if(card) card.scrollIntoView({behavior:'smooth', block:'start'});
      };
      navbar.appendChild(chip);
    });
  }

  // 渲染卡片
  function renderGrid(){
    grid.innerHTML = '';
    groups.forEach(function(g, i){
      var card = document.createElement('div');
      card.className = 'card';
      card.id = 'card-' + i;
      var search = (g.name + ' ' + g.words.map(function(w){return w.w+' '+w.cn;}).join(' ')).toLowerCase();
      card.dataset.search = search;
      var head = document.createElement('div');
      head.className = 'card-head';
      head.innerHTML = '<span class="t">' + g.name + '</span><span class="cnt"><b>' + g.words.length + '</b> 词</span>';
      card.appendChild(head);
      var words = document.createElement('div');
      words.className = 'words';
      g.words.forEach(function(w){
        var chip = document.createElement('span');
        chip.className = 'w-chip';
        chip.dataset.w = w.w;
        chip.dataset.cn = w.cn;
        chip.innerHTML = '<span class="en">' + w.w + '</span><span class="cn">' + w.cn + '</span><i class="sound">🔊</i>';
        chip.onclick = function(){
          if(mode === 'quiz'){
            var revealed = chip.classList.toggle('revealed');
            var cn = chip.querySelector('.cn');
            cn.textContent = revealed ? w.cn : '···';
          } else {
            speak(w.w);
          }
        };
        words.appendChild(chip);
      });
      card.appendChild(words);
      grid.appendChild(card);
    });
    renderNav();
  }

  // 渲染未聚类
  function renderOthers(){
    othersGrid.innerHTML = '';
    unmatched.forEach(function(w){
      var chip = document.createElement('span');
      chip.className = 'w-chip';
      chip.innerHTML = '<span class="en">' + w.w + '</span><span class="cn">' + w.cn + '</span>';
      chip.onclick = function(){ speak(w.w); };
      othersGrid.appendChild(chip);
    });
  }

  // 模式切换
  function setMode(m){
    mode = m;
    document.body.classList.toggle('quiz', m === 'quiz');
    btnQuiz.classList.toggle('active', m === 'quiz');
    btnBrowse.classList.toggle('active', m === 'browse');
    if(m === 'browse'){
      // 恢复释义
      Array.prototype.forEach.call(grid.querySelectorAll('.w-chip'), function(chip){
        chip.classList.remove('revealed');
        var cn = chip.querySelector('.cn');
        cn.textContent = chip.dataset.cn;
      });
    } else {
      // 隐藏释义
      Array.prototype.forEach.call(grid.querySelectorAll('.w-chip'), function(chip){
        chip.classList.remove('revealed');
        var cn = chip.querySelector('.cn');
        cn.textContent = '···';
      });
    }
  }
  btnQuiz.onclick = function(){ setMode('quiz'); };
  btnBrowse.onclick = function(){ setMode('browse'); };
  q.oninput = filter;

  renderGrid();
  renderOthers();
})();

</script>
