<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="习惯打卡工具，记录每日习惯并统计连续天数，纯前端本地存储。">
  <meta name="keywords" content="习惯打卡, 习惯养成, 连续天数, 自律, 记录">
  <meta name="author" content="军舰">
  <meta name="date" content="2026-06-18">
  <title>习惯打卡</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch(e) {}
    })();
  </script>
  <style>
    :root { --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #78716c; --border: #e7e5e4; --accent: #0ea5e9; --ok: #16a34a; }
    html.dark { --bg: #0c0a09; --panel: #1c1917; --text: #f5f5f4; --muted: #a8a29e; --border: #292524; --accent: #38bdf8; --ok: #4ade80; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
    .wrap { flex: 1; display: flex; flex-direction: column; gap: 1rem; padding: 1rem; max-width: 760px; margin: 0 auto; width: 100%; }
    .toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    input, button { border: 1px solid var(--border); background: var(--panel); color: var(--text);
      border-radius: 0.375rem; padding: 0.5rem 0.7rem; font-size: 0.9rem; }
    button { cursor: pointer; }
    button:hover { background: var(--bg); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .habit { border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.9rem 1rem; background: var(--panel); margin-bottom: 0.75rem; }
    .htop { display: flex; align-items: center; gap: 0.6rem; }
    .hname { font-size: 1.05rem; font-weight: 600; flex: 1; }
    .streak { font-size: 0.85rem; color: var(--muted); }
    .today { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 999px; padding: 0.3rem 0.9rem; font-size: 0.85rem; cursor: pointer; }
    .today.done { background: var(--panel); color: var(--ok); border-color: var(--ok); }
    .del { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 1rem; }
    .week { display: flex; gap: 4px; margin-top: 0.7rem; }
    .day { flex: 1; aspect-ratio: 1; border-radius: 4px; background: var(--bg); border: 1px solid var(--border); }
    .day.on { background: var(--ok); border-color: var(--ok); }
    .empty { color: var(--muted); font-size: 0.9rem; text-align: center; padding: 1.5rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <input type="text" id="name" placeholder="新习惯名称，如：每天阅读 30 分钟" style="flex:1;min-width:200px">
      <button class="primary" id="add">添加习惯</button>
    </div>
    <div id="list"></div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const TODAY = new Date().toISOString().slice(0,10);
    let habits = JSON.parse(localStorage.getItem('habits')||'[]');

    function lastDays(n){
      const out=[]; const d=new Date();
      for(let i=n-1;i>=0;i--){ const x=new Date(d); x.setDate(d.getDate()-i); out.push(x.toISOString().slice(0,10)); }
      return out;
    }
    function streak(h){
      let s=0; const d=new Date();
      for(let i=0;i<365;i++){ const x=new Date(d); x.setDate(d.getDate()-i); const k=x.toISOString().slice(0,10);
        if(h.days.includes(k)) s++; else if(i===0 && false){} else break; }
      return s;
    }
    function render(){
      const list=$('list'); list.innerHTML='';
      if(!habits.length){ list.innerHTML='<div class="empty">还没有习惯，添加第一个吧 👆</div>'; return; }
      habits.forEach((h,idx)=>{
        const div=document.createElement('div'); div.className='habit';
        const done=h.days.includes(TODAY);
        div.innerHTML=`<div class="htop"><span class="hname">${h.name}</span>`+
          `<span class="streak">连续 ${streak(h)} 天</span>`+
          `<button class="today ${done?'done':''}">${done?'已打卡':'打卡'}</button>`+
          `<button class="del">✕</button></div>`;
        const week=document.createElement('div'); week.className='week';
        lastDays(14).forEach(k=>{ const d=document.createElement('div'); d.className='day'+(h.days.includes(k)?' on':''); week.appendChild(d); });
        div.appendChild(week);
        div.querySelector('.today').onclick=()=>{
          if(h.days.includes(TODAY)) h.days=h.days.filter(x=>x!==TODAY);
          else h.days.push(TODAY);
          save(); render();
        };
        div.querySelector('.del').onclick=()=>{ habits.splice(idx,1); save(); render(); };
        list.appendChild(div);
      });
    }
    function save(){ localStorage.setItem('habits',JSON.stringify(habits)); }
    $('add').onclick=()=>{
      const n=$('name').value.trim(); if(!n) return;
      habits.push({ name:n, days:[] }); $('name').value=''; save(); render();
    };
    $('name').addEventListener('keydown',e=>{ if(e.key==='Enter') $('add').click(); });
    render();
  </script>
</body>
</html>
