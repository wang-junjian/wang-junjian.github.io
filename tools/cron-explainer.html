<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="解析 Cron 表达式并解释含义，预测未来多次执行时间，纯前端运行。">
  <meta name="keywords" content="Cron, 定时任务, 表达式, 解析, 计划">
  <meta name="author" content="军舰">
  <meta name="date" content="2026-06-18">
  <title>Cron 表达式解释器</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch(e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #78716c;
      --border: #e7e5e4; --accent: #0ea5e9; --accent-hover: #0284c7; --error: #dc2626;
    }
    html.dark {
      --bg: #0c0a09; --panel: #1c1917; --text: #f5f5f4; --muted: #a8a29e;
      --border: #292524; --accent: #38bdf8; --accent-hover: #0ea5e9; --error: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh;
    }
    .wrap { flex: 1; display: flex; flex-direction: column; gap: 1rem; padding: 1rem; max-width: 820px; margin: 0 auto; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    input[type=text] {
      flex: 1; min-width: 200px; border: 1px solid var(--border); border-radius: 0.375rem;
      padding: 0.6rem 0.75rem; background: var(--panel); color: var(--text); font-size: 1rem;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }
    button {
      border: 1px solid var(--border); background: var(--panel); color: var(--text);
      padding: 0.5rem 0.875rem; border-radius: 0.375rem; font-size: 0.875rem; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: var(--bg); border-color: var(--muted); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .card { border: 1px solid var(--border); border-radius: 0.5rem; padding: 1rem; background: var(--panel); }
    .card h3 { margin: 0 0 0.5rem; font-size: 0.95rem; }
    .desc { font-size: 0.95rem; line-height: 1.6; }
    .next { list-style: none; padding: 0; margin: 0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.9rem; }
    .next li { padding: 0.3rem 0; border-bottom: 1px dashed var(--border); }
    .status { font-size: 0.875rem; color: var(--muted); }
    .status.error { color: var(--error); }
    .hint { font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <input type="text" id="expr" placeholder="例如：0 9 * * 1-5" value="0 9 * * 1-5">
      <button class="primary" id="parse">解析</button>
      <span class="status" id="status"></span>
    </div>
    <p class="hint">格式：分 时 日 月 周（5 段，空格分隔）。支持 * , - / 以及字段范围。</p>
    <div class="card">
      <h3>含义解释</h3>
      <div class="desc" id="desc">—</div>
    </div>
    <div class="card">
      <h3>未来 10 次执行时间（基于当前时区）</h3>
      <ul class="next" id="next"><li>—</li></ul>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const NAMES = { minute:'分钟', hour:'小时', dom:'日', month:'月', dow:'星期' };
    const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    const DOWS = ['周日','周一','周二','周三','周四','周五','周六'];

    function expand(field, min, max) {
      // returns Set of allowed values or null if invalid
      const set = new Set();
      const parts = field.split(',');
      for (let p of parts) {
        if (p === '*') { for (let i = min; i <= max; i++) set.add(i); continue; }
        let step = 1, base = p;
        if (p.includes('/')) { const [r, s] = p.split('/'); step = +s; base = r === '*' ? min + '-' + max : r; }
        let lo = min, hi = max;
        if (base.includes('-')) { [lo, hi] = base.split('-').map(Number); }
        else lo = hi = +base;
        if (isNaN(lo) || isNaN(hi) || isNaN(step)) return null;
        for (let i = lo; i <= hi; i += step) set.add(i);
      }
      return set;
    }

    function explain(fields) {
      const [m, h, dom, mon, dow] = fields.map(f => expand(f, ...ranges(f)));
      const parts = [];
      parts.push(`在 ${[...h].sort((a,b)=>a-b).join('/')} 点 ${[...m].sort((a,b)=>a-b).join('/')} 分`);
      const monArr = [...mon].sort((a,b)=>a-b);
      const dowArr = [...dow].sort((a,b)=>a-b);
      let when = [];
      if (monArr.length === 12) when.push('每月'); else when.push(monArr.map(i => MONTHS[i-1]).join('、'));
      if (dowArr.length === 7) when.push('每天'); else when.push(dowArr.map(i => DOWS[i%7]).join('、'));
      if (dom.size === 31) when.push('每天'); else when.push([...dom].sort((a,b)=>a-b).join('/') + ' 日');
      return '执行于 ' + when.join('，');
    }
    function ranges(f) {
      return f === 'minute' ? [0,59] : f === 'hour' ? [0,23] : f === 'dom' ? [1,31] : f === 'month' ? [1,12] : [0,6];
    }

    function nextTimes(fields, count) {
      const labels = ['minute','hour','dom','month','dow'];
      const sets = fields.map((f,i) => expand(f, ...ranges(labels[i])));
      if (sets.some(s => !s)) return null;
      const out = [];
      const d = new Date();
      d.setSeconds(0, 0);
      let guard = 0;
      while (out.length < count && guard < 5_000_000) {
        guard++;
        const mi = d.getMinutes(), hr = d.getHours(), dm = d.getDate(), mo = d.getMonth()+1, dw = d.getDay();
        if (sets[3].has(mo) && sets[2].has(dm) && sets[4].has(dw) && sets[1].has(hr) && sets[0].has(mi)) {
          out.push(new Date(d));
          d.setMinutes(d.getMinutes() + 1);
          continue;
        }
        // advance to next minute candidate quickly
        d.setMinutes(d.getMinutes() + 1);
      }
      return out;
    }

    $('parse').onclick = () => {
      const raw = $('expr').value.trim();
      const fields = raw.split(/\s+/);
      if (fields.length !== 5) { $('status').textContent = '需要 5 个字段'; $('status').classList.add('error'); return; }
      const labels = ['minute','hour','dom','month','dow'];
      const sets = fields.map((f,i) => expand(f, ...ranges(labels[i])));
      if (sets.some(s => !s || s.size === 0)) {
        $('status').textContent = '表达式无效：' + raw; $('status').classList.add('error'); return;
      }
      $('status').classList.remove('error');
      $('status').textContent = '解析成功';
      $('desc').textContent = explain(fields);
      const times = nextTimes(fields, 10);
      const ul = $('next'); ul.innerHTML = '';
      if (!times) { ul.innerHTML = '<li>无法计算</li>'; return; }
      times.forEach(t => {
        const li = document.createElement('li');
        li.textContent = t.toLocaleString('zh-CN', {hour12:false});
        ul.appendChild(li);
      });
    };
    $('parse').click();
  </script>
</body>
</html>
