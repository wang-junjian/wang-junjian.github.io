<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="批量生成 UUID v4 与随机字符串，纯前端运行，无需联网。">
  <meta name="keywords" content="UUID, GUID, 随机字符串, 生成器, 批量">
  <meta name="author" content="军舰">
  <meta name="date" content="2026-06-18">
  <title>UUID / 随机字符串生成器</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch(e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #78716c;
      --border: #e7e5e4; --accent: #0ea5e9; --accent-hover: #0284c7; --error: #dc2626;
    }
    html.dark {
      --bg: #0c0a09; --panel: #1c1917; --text: #f5f5f4; --muted: #a8a29e;
      --border: #292524; --accent: #38bdf8; --accent-hover: #0ea5e9; --error: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh;
    }
    .wrap { flex: 1; display: flex; flex-direction: column; gap: 1rem; padding: 1rem; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    button {
      border: 1px solid var(--border); background: var(--panel); color: var(--text);
      padding: 0.5rem 0.875rem; border-radius: 0.375rem; font-size: 0.875rem; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: var(--bg); border-color: var(--muted); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .row { display: flex; flex-wrap: wrap; gap: 1rem; }
    .control { display: flex; flex-direction: column; gap: 0.375rem; }
    label { font-size: 0.875rem; color: var(--muted); }
    input, select {
      border: 1px solid var(--border); border-radius: 0.375rem; padding: 0.5rem;
      background: var(--panel); color: var(--text); font-size: 0.875rem;
    }
    textarea {
      width: 100%; min-height: 280px; resize: vertical; border: 1px solid var(--border);
      border-radius: 0.5rem; padding: 0.875rem; font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.9rem; line-height: 1.6; background: var(--panel); color: var(--text);
    }
    textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .status { font-size: 0.875rem; color: var(--muted); }
    .status.error { color: var(--error); }
    .opts { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
    .opts label { display: flex; align-items: center; gap: 0.4rem; color: var(--text); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <button class="primary" id="genUuid">生成 UUID</button>
      <button class="primary" id="genStr">生成随机字符串</button>
      <button id="copyBtn">复制结果</button>
      <button id="clearBtn">清空</button>
      <span class="status" id="status"></span>
    </div>

    <div class="opts">
      <div class="control">
        <label>数量</label>
        <input type="number" id="count" value="5" min="1" max="500" style="width:90px">
      </div>
      <label><input type="checkbox" id="upper" checked> 大写</label>
      <label><input type="checkbox" id="hyphen" checked> UUID 含连字符</label>
      <div class="control">
        <label>字符串长度</label>
        <input type="number" id="len" value="16" min="1" max="128" style="width:90px">
      </div>
      <div class="control">
        <label>字符集</label>
        <select id="charset">
          <option value="alnum">字母+数字</option>
          <option value="alpha">仅字母</option>
          <option value="num">仅数字</option>
          <option value="hex">十六进制</option>
          <option value="safe">URL 安全符号</option>
        </select>
      </div>
    </div>

    <textarea id="out" readonly placeholder="生成结果将显示在这里，每行一个"></textarea>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const status = $('status');

    function randHex(n) {
      const a = new Uint8Array(n);
      crypto.getRandomValues(a);
      return Array.from(a, b => b.toString(16).padStart(2, '0')).join('');
    }
    function uuidV4() {
      let h = randHex(16);
      h = h.slice(0, 8) + '-' + h.slice(8, 12) + '-4' + h.slice(13, 16) +
          '-' + ((parseInt(h[16], 16) & 0x3) | 0x8).toString(16) + h.slice(17, 20) +
          '-' + h.slice(20);
      return h;
    }
    function randString(len, set) {
      const sets = {
        alnum: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789',
        alpha: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz',
        num: '0123456789',
        hex: '0123456789abcdef',
        safe: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_'
      };
      const chars = sets[set] || sets.alnum;
      const a = new Uint8Array(len);
      crypto.getRandomValues(a);
      let s = '';
      for (let i = 0; i < len; i++) s += chars[a[i] % chars.length];
      return s;
    }

    $('genUuid').onclick = () => {
      const n = Math.min(500, Math.max(1, +$('count').value || 1));
      const upper = $('upper').checked;
      const hyphen = $('hyphen').checked;
      let res = [];
      for (let i = 0; i < n; i++) {
        let u = uuidV4();
        if (!hyphen) u = u.replace(/-/g, '');
        if (upper) u = u.toUpperCase();
        res.push(u);
      }
      $('out').value = res.join('\n');
      status.textContent = `已生成 ${n} 个 UUID`;
    };

    $('genStr').onclick = () => {
      const n = Math.min(500, Math.max(1, +$('count').value || 1));
      const len = Math.min(128, Math.max(1, +$('len').value || 16));
      const set = $('charset').value;
      const upper = $('upper').checked;
      let res = [];
      for (let i = 0; i < n; i++) {
        let s = randString(len, set);
        if (upper && set !== 'num' && set !== 'hex') s = s.toUpperCase();
        res.push(s);
      }
      $('out').value = res.join('\n');
      status.textContent = `已生成 ${n} 个随机字符串（长度 ${len}）`;
    };

    $('copyBtn').onclick = async () => {
      try { await navigator.clipboard.writeText($('out').value); status.textContent = '已复制到剪贴板'; }
      catch(e) { status.textContent = '复制失败：' + e.message; status.classList.add('error'); }
    };
    $('clearBtn').onclick = () => { $('out').value = ''; status.textContent = ''; };
  </script>
</body>
</html>
