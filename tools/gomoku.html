<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="五子棋人机对弈，含启发式 AI 对手，纯前端运行。">
  <meta name="keywords" content="五子棋, Gomoku, 棋类, AI对弈, 休闲">
  <meta name="author" content="军舰">
  <meta name="date" content="2026-06-18">
  <title>五子棋（AI 对弈）</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch(e) {}
    })();
  </script>
  <style>
    :root { --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #78716c; --border: #e7e5e4; --accent: #0ea5e9; --board: #e7c98b; }
    html.dark { --bg: #0c0a09; --panel: #1c1917; --text: #f5f5f4; --muted: #a8a29e; --border: #292524; --accent: #38bdf8; --board: #5b4633; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
    .wrap { flex: 1; display: flex; flex-direction: column; gap: 1rem; padding: 1rem; align-items: center; }
    .toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
    button { border: 1px solid var(--border); background: var(--panel); color: var(--text);
      padding: 0.5rem 0.875rem; border-radius: 0.375rem; font-size: 0.875rem; cursor: pointer; }
    button:hover { background: var(--bg); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    canvas { background: var(--board); border-radius: 0.4rem; touch-action: none; max-width: 92vw; }
    .status { font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <button class="primary" id="restart">重新开始</button>
      <button id="undo">悔棋</button>
      <button id="mode">当前：玩家先手</button>
    </div>
    <canvas id="cv" width="600" height="600"></canvas>
    <div class="status" id="status">你执黑先行，点击落子</div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const cv = $('cv'), ctx = cv.getContext('2d');
    const N=15, SZ=40, OFF=20;
    let board, history, playerTurn, over, humanFirst=true;
    const DIRS=[[1,0],[0,1],[1,1],[1,-1]];

    function reset(){
      board=Array.from({length:N},()=>new Array(N).fill(0));
      history=[]; over=false; playerTurn=humanFirst; render();
      $('status').textContent = humanFirst ? '你执黑先行' : 'AI 先行…';
      if(!humanFirst) setTimeout(aiMove,300);
    }
    function render(){
      ctx.clearRect(0,0,cv.width,cv.height);
      for(let i=0;i<N;i++){ ctx.beginPath(); ctx.moveTo(OFF,OFF+i*SZ); ctx.lineTo(OFF+(N-1)*SZ,OFF+i*SZ); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(OFF+i*SZ,OFF); ctx.lineTo(OFF+i*SZ,OFF+(N-1)*SZ); ctx.stroke(); }
      for(let r=0;r<N;r++)for(let c=0;c<N;c++){
        if(board[r][c]){ ctx.fillStyle=board[r][c]===1?'#111':'#fff';
          ctx.beginPath(); ctx.arc(OFF+c*SZ,OFF+r*SZ,15,0,Math.PI*2); ctx.fill();
          ctx.strokeStyle='#000'; ctx.stroke(); }
      }
    }
    function win(r,c,p){
      for(const [dr,dc] of DIRS){
        let cnt=1;
        for(let s=1;s<5;s++){ const nr=r+dr*s,nc=c+dc*s; if(nr<0||nc<0||nr>=N||nc>=N||board[nr][nc]!==p) break; cnt++; }
        for(let s=1;s<5;s++){ const nr=r-dr*s,nc=c-dc*s; if(nr<0||nc<0||nr>=N||nc>=N||board[nr][nc]!==p) break; cnt++; }
        if(cnt>=5) return true;
      }
      return false;
    }
    function place(r,c,p){
      board[r][c]=p; history.push([r,c]); render();
      if(win(r,c,p)){ over=true; $('status').textContent = p===1?(humanFirst?'你赢了！':'AI（黑）赢了'):(humanFirst?'AI（白）赢了':'你赢了！'); return true; }
      return false;
    }
    cv.addEventListener('click', e=>{
      if(over||!playerTurn) return;
      const rect=cv.getBoundingClientRect();
      const x=(e.clientX-rect.left)*(cv.width/rect.width), y=(e.clientY-rect.top)*(cv.height/rect.height);
      const c=Math.round((x-OFF)/SZ), r=Math.round((y-OFF)/SZ);
      if(r<0||c<0||r>=N||c>=N||board[r][c]) return;
      if(!place(r,c,1)){ playerTurn=false; setTimeout(aiMove,250); }
    });
    function aiMove(){
      if(over) return;
      const m=bestMove(2);
      if(m){ if(!place(m[0],m[1],2)){ playerTurn=true; } } else { over=true; $('status').textContent='平局'; }
    }
    function scorePoint(r,c,p){
      let total=0;
      for(const [dr,dc] of DIRS){
        let cnt=1, block=0;
        for(let s=1;s<5;s++){ const nr=r+dr*s,nc=c+dc*s;
          if(nr<0||nc<0||nr>=N||nc>=N){ block++; break; }
          if(board[nr][nc]===p) cnt++; else if(board[nr][nc]!==0){ block++; break; } else break; }
        for(let s=1;s<5;s++){ const nr=r-dr*s,nc=c-dc*s;
          if(nr<0||nc<0||nr>=N||nc>=N){ block++; break; }
          if(board[nr][nc]===p) cnt++; else if(board[nr][nc]!==0){ block++; break; } else break; }
        if(cnt>=5) total+=100000;
        else if(cnt===4&&block===0) total+=10000;
        else if(cnt===4&&block===1) total+=1000;
        else if(cnt===3&&block===0) total+=500;
        else if(cnt===3&&block===1) total+=100;
        else if(cnt===2&&block===0) total+=50;
      }
      return total;
    }
    function bestMove(p){
      let best=null, bestScore=-1;
      const cand=new Set();
      for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(board[r][c]){
        for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){
          const nr=r+dr,nc=c+dc; if(nr>=0&&nc>=0&&nr<N&&nc<N&&!board[nr][nc]) cand.add(nr*N+nc);
        }
      }
      if(!cand.size){ const m=Math.floor(N/2); return [m,m]; }
      for(const key of cand){
        const r=Math.floor(key/N), c=key%N;
        const s=scorePoint(r,c,p)+scorePoint(r,c,p===1?2:1)*0.9;
        if(s>bestScore){ bestScore=s; best=[r,c]; }
      }
      return best;
    }
    $('restart').onclick=reset;
    $('undo').onclick=()=>{
      if(history.length){ const last=history.pop(); board[last[0]][last[1]]=0;
        if(history.length){ const l2=history.pop(); board[l2[0]][l2[1]]=0; }
        over=false; playerTurn=true; render(); $('status').textContent='已悔棋，你落子'; }
    };
    $('mode').onclick=()=>{ humanFirst=!humanFirst; $('mode').textContent='当前：'+(humanFirst?'玩家先手':'AI 先手'); reset(); };
    reset();
  </script>
</body>
</html>
