const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const jstr = o => JSON.stringify(o, null, 1).replace(/</g, "\\u003c");
const opColor = op => DATA.colors[op] || "#475569";
const fmt = ms => (ms/1000).toFixed(1) + "s";

// ---------- header ----------
document.getElementById("goal").textContent = "目标：" + DATA.summary.goal;
const S = DATA.summary;
const stat = (label, v) => `<div class="stat">${label} <b>${v}</b></div>`;
document.getElementById("stats").innerHTML =
  stat("状态", S.status) + stat("总耗时", fmt(S.total_ms)) +
  stat("决策", S.decisions) + stat("执行", S.executed) + stat("stale 作废", S.stale) +
  stat("Jev tokens", (S.jev_input_tokens/1000).toFixed(1) + "k in / " + S.jev_output_tokens + " out") +
  stat("估算成本", "$" + S.jev_cost_usd) + stat("文本生成", S.text_calls + " 次");

// ---------- sidebar ----------
let cur = 0;
const stepsEl = document.getElementById("steps");
stepsEl.innerHTML = DATA.steps.map((d, i) => {
  const lbl = d.choice === "DONE" || d.choice === "BLOCKED" ? d.choice
    : (d.executed ? d.executed.action : (d.raw_answers?.operation?.criteria?.[d.choice] || d.choice));
  return `<div class="step" id="st${i}">
    <span class="num">${d.i}</span>
    <span class="dot ${d.outcome}"></span>
    <span class="badge" style="background:${opColor(d.operation)}">${d.operation}</span>
    <span class="lbl" title="${esc(lbl)}">${esc(lbl || "")}</span>
  </div>`;
}).join("");
stepsEl.addEventListener("click", e => { const el = e.target.closest(".step"); if (el) show(+el.id.slice(2)); });

// ---------- detail renderers ----------
function critRows(criteria) {
  return Object.entries(criteria).map(([k, v]) => {
    const val = typeof v === "object" && v !== null
      ? Object.entries(v).filter(([kk]) => kk !== "element").map(([kk, vv]) => `${kk}=${esc(vv)}`).join(" · ")
      : esc(v);
    const first = typeof v === "object" && v !== null ? esc(v.element) : "";
    return `<tr><td class="k">${esc(k)}</td><td>${first ? first + "<br><span class='muted'>" + val + "</span>" : val}</td></tr>`;
  }).join("");
}
function probBar(head, probs, selKey) {
  const m = probs && probs.probabilities ? probs.probabilities : probs;  // 接受 answer 对象或纯映射
  const entries = Object.entries(m || {}).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return "<div class='muted' style='font-size:12px;padding:4px 0'>（无应答）</div>";
  return entries.map(([k, p]) => `
    <div class="prow ${k === selKey ? "sel" : ""}">
      <span class="pkey">${esc(k)}</span>
      <span class="plabel">${esc(head?.criteria?.[k]?.element ?? head?.criteria?.[k] ?? k)}</span>
      <div class="pbar"><div style="width:${Math.max(2, p * 100)}%"></div></div>
      <span class="pval">${p.toFixed(3)}</span>
    </div>`).join("");
}
function headCard(name, question, answer, chosenTarget, op, effTag) {
  const label = { operation: "operation — 下一步做什么操作",
    click_target: "click_target — 若执行 CLICK，点哪个元素",
    type_text_target: "type_text_target — 若执行 TYPE_TEXT，填哪个字段",
    select_target: "select_target — 若执行 SELECT，选哪个选项" }[name] || name;
  const rs = question?.instructions?.rules;
  const ruleList = Array.isArray(rs) ? rs : (rs ? [rs] : []);
  const rules = ruleList.map(r => `<pre>${esc(r)}</pre>`).join("");
  const goal = question?.instructions?.goal ? `<div class="kv"><b>goal</b>: ${esc(question.instructions.goal)}</div>` : "";
  return `<div class="head ${effTag === "void" ? "voided" : ""}">
    <div class="hcap">${esc(label)} ${effTag === "ok" ? '<span class="ok-tag">命中 · 生效</span>' : effTag === "void" ? '<span class="void-tag">未被命中 → 作废</span>' : ""}</div>
    <div class="hbody">
      ${goal}
      <details><summary class="muted" style="cursor:pointer;font-size:12px">指令 rules</summary>${rules || "<span class='muted'>无</span>"}</details>
      <details open><summary style="cursor:pointer;font-size:12px">候选 criteria（${Object.keys(question?.criteria || {}).length}）</summary>
        <table><tr><th>choice</th><th>描述</th></tr>${critRows(question?.criteria || {})}</table></details>
      <div style="margin-top:6px;font-size:12px" class="muted">Jev 应答概率${name !== "operation" ? "（置信度 " + (answer?.confidence ?? "—") + "）" : "（置信度 " + (answer?.confidence ?? "—") + "）"}：</div>
      ${probBar(question, answer, name === "operation" ? op : chosenTarget)}
    </div></div>`;
}

function whatHappened(d) {
  if (d.outcome === "stale") return `Jev 给出了判断（<b>${d.operation}</b>${d.choice === "DONE" || d.choice === "BLOCKED" ? "" : " → [" + esc(d.target) + "]"}），但决策时的页面指纹与执行时不一致——页面在此期间发生了变化。该决策按设计被<b>丢弃，未执行</b>，Agent 重新观察页面后再次决策。这就是投机扇出架构应对动态页面的方式：宁可作废，绝不基于过期状态点击。`;
  if (d.outcome === "terminal") return `Jev 判定 <b>${d.choice}</b>：${d.choice === "DONE" ? "所有要求均已可见满足，任务结束" : "无法继续推进，任务受阻"}。此决策被消费执行（不再产生动作，因此不出现在执行历史里）。`;
  const ex = d.executed;
  const txt = ex.text != null ? `，小 LLM 生成文本「${esc(ex.text)}」（${esc(ex.text_helper)}，${ex.text_latency_ms}ms）` : "";
  const pc = ex.page_changed ? "页面发生变化" : "页面未变化";
  return `决策被消费执行：<b>${ex.kind}</b> 「${esc(ex.action)}」${txt}。执行概率 ${ex.probability?.toFixed(2)}，执行后 ${pc}。`;
}

function renderDetail(d) {
  const req = d.request || {};
  const page = req.state?.page || {};
  const elements = req.state?.elements || [];
  const questions = req.questions || {};
  const raw = d.raw_answers || {};
  const effHeads = Object.keys(questions).map(name => {
    if (name === "operation") return headCard(name, questions[name], raw[name], null, d.choice, null);
    const qOp = name.replace("_target", "").toUpperCase();
    const hit = qOp === d.operation && d.outcome !== "stale";
    return headCard(name, questions[name], raw[name], hit ? d.target : null, d.choice, hit ? "ok" : "void");
  }).join("");
  const ex = d.executed;
  const execHtml = d.outcome === "stale"
    ? `<div class="outcome stale">⨯ 未执行 —— 决策作废（页面指纹已变化）</div>`
    : d.outcome === "terminal"
      ? `<div class="outcome terminal">■ 终止：${d.choice}</div>`
      : `<div class="outcome">
          <div class="kv">动作：<b>${esc(ex.kind)}</b> ${esc(ex.action)}</div>
          ${ex.text != null ? `<div class="kv">输入文本：<b>「${esc(ex.text)}」</b>（由 ${esc(ex.text_helper)} 生成，${ex.text_latency_ms}ms）</div>` : ""}
          <div class="kv">执行概率：${ex.probability?.toFixed(3)} · 置信度：${ex.confidence?.toFixed(2)} · 执行后页面变化：${ex.page_changed ? "是" : "否"}</div>
        </div>`;
  const tc = d.text_call;
  const tcHtml = tc ? `<div class="sec" open><details open class="sec"><summary>文本生成调用（TYPE_TEXT · ${esc(tc.model)} · ${tc.latency_ms}ms）</summary><div class="body">
      <div class="kv">字段：${esc(tc.field)} → 值：<b>「${esc(tc.value)}」</b></div>
      <pre>${esc(jstr(tc.usage))}</pre></div></details></div>` : "";
  document.getElementById("detail").innerHTML = `
    <div class="what">第 ${d.i} 步 / ${DATA.steps.length} · T+${fmt(d.elapsed_ms)} · Jev 延迟 ${d.latency_ms}ms<br>${whatHappened(d)}</div>
    ${execHtml}${tcHtml}
    <details class="sec" open><summary>① 输入 · 页面状态 <span class="n">（发给 Jev 的观察）</span></summary><div class="body">
      <div class="kv">URL：<span class="mono">${esc(page.url)}</span></div>
      <div class="kv">标题：${esc(page.title)}</div>
      <details><summary class="muted" style="cursor:pointer;font-size:12px">页面文本（${(page.text || "").length} 字符）</summary>
        <pre>${esc(page.text)}</pre></details>
      ${d.outcome === "stale" ? `<div class="muted" style="font-size:12px">注意：这是<b>决策时</b>的页面快照。执行时页面已变化，所以本步被作废。</div>` : ""}
    </div></details>
    <details class="sec"><summary>② 输入 · 元素表 <span class="n">（动态动作空间 · ${elements.length} 个可操作元素）</span></summary><div class="body">
      <table><tr><th>#</th><th>role</th><th>label</th><th>value</th><th>operations</th></tr>
      ${elements.map(e => `<tr><td class="k">${esc(e.index)}</td><td>${esc(e.role || "")}</td><td>${esc(e.label)}</td><td class="muted">${esc(e.value ?? "")}</td><td class="mono">${esc((e.operations || []).join(", "))}</td></tr>`).join("")}
      </table></div></details>
    <details class="sec" open><summary>③+④ 投机扇出 · 问题与 Jev 应答 <span class="n">（一次请求并行回答所有 head）</span></summary><div class="body">${effHeads}</div></details>
    <details class="sec"><summary>⑤ usage 与原始 JSON <span class="n">（完整可审计）</span></summary><div class="body">
      <div class="kv">Jev tokens：<b>${JSON.stringify(d.usage)}</b></div>
      <details><summary class="mono" style="cursor:pointer">完整 request（state + questions）</summary><pre>${esc(jstr(req))}</pre></details>
      <details><summary class="mono" style="cursor:pointer">完整 raw_answers</summary><pre>${esc(jstr(d.raw_answers))}</pre></details>
    </div></details>`;
}

function show(i) {
  cur = i;
  document.querySelectorAll(".step").forEach((el, j) => el.classList.toggle("sel", j === cur));
  renderDetail(DATA.steps[cur]);
  const el = document.getElementById("st" + cur);
  el.scrollIntoView({ block: "nearest" });
  document.getElementById("detail").scrollTop = 0;
}
document.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); show(Math.min(cur + 1, DATA.steps.length - 1)); }
  if (e.key === "ArrowUp") { e.preventDefault(); show(Math.max(cur - 1, 0)); }
});
show(0);

</script>
