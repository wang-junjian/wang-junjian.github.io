<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="上传 EPUB 电子书，分页阅读并支持朗读，纯前端运行（基于 JSZip）。">
  <meta name="keywords" content="EPUB, 电子书, 阅读器, 朗读, 翻页">
  <meta name="author" content="军舰">
  <meta name="date" content="2026-06-18">
  <title>EPUB 阅读器</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch(e) {}
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #78716c;
      --border: #e7e5e4; --accent: #0ea5e9; --accent-hover: #0284c7; --error: #dc2626;
    }
    html.dark {
      --bg: #0c0a09; --panel: #1c1917; --text: #f5f5f4; --muted: #a8a29e;
      --border: #292524; --accent: #38bdf8; --accent-hover: #0ea5e9; --error: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh;
    }
    .top { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
    button {
      border: 1px solid var(--border); background: var(--panel); color: var(--text);
      padding: 0.45rem 0.8rem; border-radius: 0.375rem; font-size: 0.85rem; cursor: pointer;
    }
    button:hover { background: var(--bg); border-color: var(--muted); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .content {
      flex: 1; overflow: auto; padding: 2rem; line-height: 1.8; font-size: 1.05rem;
      max-width: 760px; margin: 0 auto; width: 100%;
    }
    .content img { max-width: 100%; }
    .status { font-size: 0.85rem; color: var(--muted); margin-left: auto; }
    .status.error { color: var(--error); }
    input[type=file] { font-size: 0.85rem; }
    .tts-controls { display: flex; gap: 0.5rem; align-items: center; }
  </style>
</head>
<body>
  <div class="top">
    <input type="file" id="file" accept=".epub">
    <button id="prev" disabled>上一页</button>
    <button id="next" disabled>下一页</button>
    <span class="tts-controls">
      <button id="read">朗读本章</button>
      <button id="stop" disabled>停止</button>
    </span>
    <span class="status" id="status">请选择一个 .epub 文件</span>
  </div>
  <div class="content" id="content"><p style="color:var(--muted)">未加载书籍。</p></div>

  <script>
    const $ = id => document.getElementById(id);
    let chapters = [], idx = 0, zip = null;
    const status = $('status');

    function parseXml(str) {
      return new DOMParser().parseFromString(str, 'application/xml');
    }
    async function loadEpub(buf) {
      zip = await JSZip.loadAsync(buf);
      const container = await zip.file('META-INF/container.xml').async('string');
      const cxml = parseXml(container);
      const opfPath = cxml.querySelector('rootfile').getAttribute('full-path');
      const opfDir = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';
      const opf = parseXml(await zip.file(opfPath).async('string'));
      const manifest = {};
      opf.querySelectorAll('manifest > item').forEach(it => {
        manifest[it.getAttribute('id')] = { href: it.getAttribute('href'), type: it.getAttribute('media-type') };
      });
      const spine = [...opf.querySelectorAll('spine > itemref')].map(ref => ref.getAttribute('idref'));
      chapters = [];
      for (const id of spine) {
        const item = manifest[id];
        if (!item || !/xhtml|html/.test(item.type)) continue;
        const path = opfDir + item.href;
        const text = await zip.file(path).async('string');
        chapters.push(text);
      }
      idx = 0;
      render();
      $('prev').disabled = false; $('next').disabled = false;
      status.textContent = `共 ${chapters.length} 章`;
    }
    function render() {
      const div = $('content');
      div.innerHTML = chapters[idx] || '';
      div.querySelectorAll('script,style').forEach(e => e.remove());
      div.scrollTop = 0;
    }
    $('file').onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      status.textContent = '解析中…';
      try { await loadEpub(await f.arrayBuffer()); }
      catch(err) { status.textContent = '加载失败：' + err.message; status.classList.add('error'); }
    };
    $('prev').onclick = () => { if (idx > 0) { idx--; render(); } };
    $('next').onclick = () => { if (idx < chapters.length - 1) { idx++; render(); } };

    let utter = null;
    $('read').onclick = () => {
      if (!('speechSynthesis' in window)) { status.textContent = '浏览器不支持朗读'; return; }
      speechSynthesis.cancel();
      const text = $('content').innerText.replace(/\s+/g, ' ').trim().slice(0, 12000);
      utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-CN';
      utter.onend = () => { $('stop').disabled = true; };
      speechSynthesis.speak(utter);
      $('stop').disabled = false;
    };
    $('stop').onclick = () => { speechSynthesis.cancel(); $('stop').disabled = true; };
  </script>
</body>
</html>
