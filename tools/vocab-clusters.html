<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="高考英语词汇近义词聚合记忆工具，将3302个单词按语义聚类为1346个近义词组，支持搜索过滤、自测模式（隐藏中文释义）、语音朗读（跨平台优选）、分组自动播放，高效拓展词汇量。">
<meta name="keywords" content="高考英语, 词汇聚类, 近义词, 单词记忆, 语音朗读, 自测模式, 自动播放, Hy3">
<meta name="author" content="军舰">
<meta name="date" content="2026-08-03">
<title>高考英语词汇 · 近义词聚合</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1f2430; --sub:#6b7280;
    --line:#e7e9ee; --accent:#3b6ef5; --accent-soft:#eaf0ff;
    --chip:#f3f5f9; --chip-ink:#23304a; --good:#1f9d55;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  header{position:sticky;top:0;z-index:20;background:rgba(246,247,249,.92);
    backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 18px;}
  .wrap{max-width:1100px;margin:0 auto;}
  h1{font-size:19px;margin:0 0 2px;}
  .meta{color:var(--sub);font-size:13px;margin-bottom:10px;}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  input[type=search]{flex:1;min-width:220px;padding:9px 12px;border:1px solid var(--line);
    border-radius:10px;font-size:14px;background:#fff;color:var(--ink);}
  .sizectl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);}
  input[type=range]{accent-color:var(--accent);}
  .toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);user-select:none;cursor:pointer;}
  main{max-width:1100px;margin:18px auto 60px;padding:0 18px;}
  .group{background:var(--card);border:1px solid var(--line);border-radius:14px;
    margin-bottom:14px;overflow:hidden;box-shadow:0 1px 2px rgba(20,30,60,.04);}
  .ghead{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;}
  .badge{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;
    border-radius:999px;padding:3px 10px;min-width:34px;text-align:center;}
  .gtitle{font-weight:600;font-size:15px;flex:1;}
  .gtitle small{color:var(--sub);font-weight:400;margin-left:8px;font-size:12px;}
  .chev{color:var(--sub);transition:transform .18s;font-size:12px;}
  .group.collapsed .chev{transform:rotate(-90deg);}
  .gplay{margin-left:6px;padding:5px 12px;border:1px solid var(--accent);background:var(--accent-soft);
    color:var(--accent);font-size:12.5px;font-weight:600;border-radius:999px;cursor:pointer;
    transition:background .12s,color .12s;white-space:nowrap;}
  .gplay:hover{background:#e3ecff;}
  .gplay.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .gbodies{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:8px;padding:4px 14px 16px;}
  .group.collapsed .gbodies{display:none;}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 10px;
    line-height:1.35;display:flex;flex-direction:column;gap:2px;transition:transform .08s;}
  .chip:hover{transform:translateY(-1px);border-color:#cfd6e4;}
  .chip .en{font-weight:700;color:var(--chip-ink);font-size:14px;word-break:break-word;}
  .chip .cn{color:var(--sub);font-size:12.5px;word-break:break-word;}
  /* 自测模式：隐藏中文（单词卡片释义 + 多词组标题的代表义） */
  body.hide-cn .cn, body.hide-cn .rep{visibility:hidden;}
  mark{background:#fff3a8;border-radius:3px;padding:0 1px;}
  .empty{color:var(--sub);text-align:center;padding:40px;font-size:14px;}

  /* 控制按钮 / 语音选择器 */
  button.btn{background:#fff;border:1px solid var(--line);color:var(--ink);font-size:13px;
    padding:8px 13px;border-radius:10px;cursor:pointer;transition:background .12s,border-color .12s;white-space:nowrap;}
  button.btn:hover{background:#f0f3f9;border-color:#cfd6e4;}
  button.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  button.btn.primary:hover{background:#2f5fe0;}
  .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px;}
  .playstatus{font-size:12px;color:var(--sub);}
  .vselect{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin-left:auto;}
  select#voiceSel{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;
    color:var(--ink);font-size:13px;max-width:300px;cursor:pointer;}

  /* 单词可点击发音 */
  .chip{cursor:pointer;}
  .chip .en::before{content:"\1F50A";opacity:0;font-size:12px;margin-right:4px;transition:opacity .12s;}
  .chip:hover .en::before{opacity:.5;}
  .chip.playing{background:var(--accent-soft);border-color:var(--accent);
    box-shadow:0 0 0 2px rgba(59,110,245,.28);}
  .chip.playing .en::before{opacity:1;}
  footer{max-width:1100px;margin:0 auto 40px;padding:0 18px;color:var(--sub);font-size:12px;}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>高考英语词汇 · 近义词聚合</h1>
  <div class="meta" id="meta"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="搜索英文或中文释义，例如 accept / 接受 / 美丽" />
    <div class="sizectl">最小组大小
      <input type="range" id="minSize" min="2" max="20" value="2" />
      <span id="minSizeVal">2</span>
    </div>
    <label class="toggle"><input type="checkbox" id="showSingle" /> 显示无近义词单词</label>
  </div>
  <div class="row2">
    <button class="btn" id="expandAll">▸ 全部展开</button>
    <button class="btn" id="collapseAll">▾ 全部折叠</button>
    <button class="btn primary" id="playBtn">▶ 自动播放</button>
    <button class="btn" id="quizBtn">隐藏中文</button>
    <span class="playstatus" id="playStatus"></span>
    <label class="vselect">语音
      <select id="voiceSel"></select>
    </label>
  </div>
</div></header>

<main id="app"></main>
<footer>共 <span id="ftotal"></span> 个单词，按中文释义的 TF-IDF 余弦相似度做层次聚类聚合。点击分组标题可折叠/展开。</footer>

const META = {"total": 3302, "groups": 1346, "multi": 854, "singletons": 492, "threshold": 0.78};

const app = document.getElementById('app');
const qEl = document.getElementById('q');
const minEl = document.getElementById('minSize');
const minVal = document.getElementById('minSizeVal');
const showSingleEl = document.getElementById('showSingle');
document.getElementById('meta').textContent =
  `共 ${META.total} 词，聚合为 ${META.groups} 个近义词组（含 ${META.multi} 个多词组合，${META.singletons} 个无近义词），聚类阈值 ${META.threshold}`;

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hl(text, q){
  if(!q) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(text);
  return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i,i+q.length)) + '</mark>' + esc(text.slice(i+q.length));
}

/* ===================== 语音 / 发音 ===================== */
const voiceSel = document.getElementById('voiceSel');
const playBtn = document.getElementById('playBtn');
const playStatus = document.getElementById('playStatus');
let allVoices = [];
let isPlaying = false;
let playQueue = [];
let playIndex = -1;
let resumeTimer = null;
let activeGroupBtn = null;

function initVoices(){
  allVoices = (window.speechSynthesis ? speechSynthesis.getVoices() : []) || [];
  populateVoices();
  if(window.speechSynthesis){
    speechSynthesis.onvoiceschanged = () => { allVoices = speechSynthesis.getVoices(); populateVoices(); };
  }
}

function populateVoices(){
  const saved = localStorage.getItem('vocab_voice') || 'auto';
  voiceSel.innerHTML = '';
  const opt0 = document.createElement('option');
  opt0.value = 'auto'; opt0.textContent = '✨ 自动（推荐）';
  voiceSel.appendChild(opt0);
  const enVoices = allVoices.filter(v => (v.lang||'').toLowerCase().startsWith('en'));
  enVoices.forEach(v => {
    const o = document.createElement('option');
    o.value = v.voiceURI || v.name;
    const loc = (v.lang||'').replace('_',' ');
    o.textContent = v.name + (loc ? ' ('+loc+')' : '');
    voiceSel.appendChild(o);
  });
  voiceSel.value = saved;
}

// 跨平台语音优选（绝不用中文语音）
function pickAutoVoice(voices){
  if(!voices || !voices.length) return null;
  const plat = (navigator.platform||'') + ' ' + navigator.userAgent;
  const isMac = /Mac/i.test(plat);
  const isWin = /Win/i.test(plat);
  const en = voices.filter(v => (v.lang||'').toLowerCase().startsWith('en'));
  const pool = en.length ? en : voices.filter(v => !/^(zh|cmn|cn|yue|wuu)/i.test(v.lang||''));
  let prefer;
  if(isMac){
    prefer = ['Samantha','Ava','Allison','Susan','Karen','Daniel','Serena','Moira','Victoria','Tessa','Google US English','Google UK English'];
  } else if(isWin){
    prefer = ['Microsoft Aria Online (Natural) - English (United States)','Microsoft Aria','Microsoft Ana Online (Natural) - English (United Kingdom)','Microsoft Ana','Microsoft Guy','Microsoft Jenny','Microsoft Zira','Microsoft David','Aria','Ana','Guy','Jenny','Zira','David','Google US English','Google UK English'];
  } else {
    prefer = ['Google US English','Google UK English','Microsoft Aria','Microsoft Jenny','Samantha','Ava','Daniel','Karen'];
  }
  for(const name of prefer){
    const f = pool.find(v => v.name && v.name.toLowerCase().includes(name.toLowerCase()));
    if(f) return f;
  }
  return pool[0] || null;
}

function getActiveVoice(){
  if(!allVoices.length) allVoices = (window.speechSynthesis ? speechSynthesis.getVoices() : []) || [];
  const sel = voiceSel.value || 'auto';
  if(sel === 'auto') return pickAutoVoice(allVoices);
  const v = allVoices.find(x => (x.voiceURI||x.name) === sel);
  return v || pickAutoVoice(allVoices);
}

function speakWord(word, done, el){
  if(!window.speechSynthesis){ done && done(); return; }
  if(el) el.classList.add('playing');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US';
  const v = getActiveVoice();
  if(v) u.voice = v;
  u.rate = 0.95; u.pitch = 1.0;
  let finished = false;
  const finish = () => { if(finished) return; finished = true; if(el) el.classList.remove('playing'); done && done(); };
  u.onend = finish;
  u.onerror = finish;
  speechSynthesis.speak(u);
  const est = Math.max(700, word.length * 230 + 500);  // onend 兜底
  setTimeout(finish, est);
}

function onChipClick(word, el){
  if(isPlaying) stopAutoPlay();
  document.querySelectorAll('.chip.playing').forEach(c => c.classList.remove('playing'));
  speakWord(word, null, el);
}

function expandAll(){ document.querySelectorAll('.group').forEach(g => g.classList.remove('collapsed')); }
function collapseAll(){ document.querySelectorAll('.group').forEach(g => g.classList.add('collapsed')); }

function togglePlay(){ isPlaying ? stopAutoPlay() : startAutoPlay(); }

// 统一入口：从指定队列开始连读；scopeBtn 为 null 表示全局，否则为某个分组的「播放」按钮
function startAutoPlayFrom(queue, scopeBtn){
  if(!window.speechSynthesis){ alert('当前浏览器不支持语音合成（Web Speech API）。'); return; }
  if(!queue.length) return;
  stopAutoPlay();                       // 先停下任何正在进行的播放
  playQueue = queue;
  isPlaying = true;
  playBtn.textContent = '⏸ 暂停播放';
  activeGroupBtn = scopeBtn;
  if(scopeBtn){ scopeBtn.textContent = '停止'; scopeBtn.classList.add('on'); }
  playStatus.textContent = scopeBtn ? '播放中 1/' + playQueue.length
                                    : '播放中 1/' + playQueue.length;
  resumeTimer = setInterval(() => { if(isPlaying && speechSynthesis.paused) speechSynthesis.resume(); }, 1000);
  playIndex = -1;
  playNext();
}

function startAutoPlay(){
  startAutoPlayFrom(
    Array.from(document.querySelectorAll('.chip')).map(c => ({
      el: c, word: c.querySelector('.en').textContent
    })), null);
}

// 播放某个分组内的全部单词
function playGroup(btn){
  if(isPlaying){ stopAutoPlay(); return; }   // 正在播放 -> 停止
  const card = btn.closest('.group');
  if(!card) return;
  card.classList.remove('collapsed');        // 展开本组
  const chips = Array.from(card.querySelectorAll('.chip'));
  startAutoPlayFrom(chips.map(c => ({
    el: c, word: c.querySelector('.en').textContent
  })), btn);
}

function playNext(){
  if(!isPlaying) return;
  playIndex++;
  if(playIndex >= playQueue.length){ stopAutoPlay(); return; }
  const item = playQueue[playIndex];
  const group = item.el.closest('.group');
  if(group) group.classList.remove('collapsed');           // 确保能看见当前单词
  document.querySelectorAll('.chip.playing').forEach(c => c.classList.remove('playing'));
  item.el.classList.add('playing');
  item.el.scrollIntoView({behavior:'smooth', block:'center'});
  playStatus.textContent = '播放中 ' + (playIndex+1) + '/' + playQueue.length;
  speakWord(item.word, () => { if(isPlaying) setTimeout(playNext, 350); }, item.el);
}

function stopAutoPlay(){
  isPlaying = false;
  if(resumeTimer){ clearInterval(resumeTimer); resumeTimer = null; }
  if(window.speechSynthesis) speechSynthesis.cancel();
  document.querySelectorAll('.chip.playing').forEach(c => c.classList.remove('playing'));
  playBtn.textContent = '▶ 自动播放';
  playStatus.textContent = '';
  playIndex = -1;
  activeGroupBtn = null;
  // 复位所有分组播放按钮
  document.querySelectorAll('.gplay').forEach(b => { b.textContent = '播放'; b.classList.remove('on'); });
}

function onVoiceChange(){
  localStorage.setItem('vocab_voice', voiceSel.value);  // 记忆选择，下次打开仍生效
  // 播放中的单词会在下一句自然切换到新语音，无需打断
}

function build(){
  stopAutoPlay();
  const q = qEl.value.trim();
  const minSz = parseInt(minEl.value,10);
  minVal.textContent = minSz;
  app.innerHTML = '';

  let shownGroups = 0, shownWords = 0;

  DATA.groups.forEach((g, idx) => {
    if(g.length < minSz) return;
    // 搜索过滤
    let members = g;
    if(q){
      members = g.filter(([w,m]) =>
        w.toLowerCase().includes(q.toLowerCase()) || m.includes(q));
      if(members.length === 0) return;
    }
    shownGroups++; shownWords += members.length;

    const card = document.createElement('div');
    card.className = 'group';
    const rep = members[0][1].split(/[；;，,]/)[0];
    const head = document.createElement('div');
    head.className = 'ghead';
      head.innerHTML = `<span class="badge">${members.length}</span>`+
        `<span class="gtitle">第 ${idx+1} 组 <small class="rep">${esc(rep)}</small></span>`+
      `<button class="gplay" type="button">播放</button>`+
      `<span class="chev">▼</span>`;
    head.onclick = (e) => { if(e.target.classList.contains('gplay')) return; card.classList.toggle('collapsed'); };
    const gplayBtn = head.querySelector('.gplay');
    gplayBtn.onclick = (e) => { e.stopPropagation(); playGroup(gplayBtn); };
    const body = document.createElement('div');
    body.className = 'gbodies';
    members.forEach(([w,m]) => {
      const c = document.createElement('div');
      c.className = 'chip';
      c.innerHTML = `<span class="en">${hl(w,q)}</span><span class="cn">${hl(m,q)}</span>`;
      c.title = '点击发音';
      c.addEventListener('click', () => onChipClick(w, c));
      body.appendChild(c);
    });
    card.appendChild(head); card.appendChild(body);
    if (!q) card.classList.add('collapsed');  // 空闲时折叠，搜索时自动展开
    app.appendChild(card);
  });

  // 无近义词单词 —— 按首字母聚合成「组」卡片，交互与多词组完全统一（更紧凑）
  if(showSingleEl.checked){
    const singles = DATA.singletons.filter(([w,m]) =>
      !q || w.toLowerCase().includes(q.toLowerCase()) || m.includes(q));
    const byLetter = {};
    singles.forEach(([w,m]) => {
      const k = (w[0]||'?').toUpperCase();
      (byLetter[k] = byLetter[k]||[]).push([w,m]);
    });
    let groupNo = DATA.groups.length;   // 紧接多词组之后连续编号
    Object.keys(byLetter).sort().forEach(letter => {
      const members = byLetter[letter];
      groupNo++;
      shownGroups++; shownWords += members.length;
      const card = document.createElement('div');
      card.className = 'group';
      const head = document.createElement('div');
      head.className = 'ghead';
      head.innerHTML = `<span class="badge">${members.length}</span>`+
        `<span class="gtitle">第 ${groupNo} 组 <small>字母 ${esc(letter)} · ${members.length} 词</small></span>`+
        `<button class="gplay" type="button">播放</button>`+
        `<span class="chev">▼</span>`;
      head.onclick = (e) => { if(e.target.classList.contains('gplay')) return; card.classList.toggle('collapsed'); };
      const gplayBtn = head.querySelector('.gplay');
      gplayBtn.onclick = (e) => { e.stopPropagation(); playGroup(gplayBtn); };
      const body = document.createElement('div');
      body.className = 'gbodies';
      members.forEach(([w,m]) => {
        const c = document.createElement('div');
        c.className = 'chip';
        c.innerHTML = `<span class="en">${hl(w,q)}</span><span class="cn">${hl(m,q)}</span>`;
        c.title = '点击发音';
        c.addEventListener('click', () => onChipClick(w, c));
        body.appendChild(c);
      });
      card.appendChild(head); card.appendChild(body);
      if (!q) card.classList.add('collapsed');  // 空闲时折叠，搜索时自动展开
      app.appendChild(card);
    });
  }

  if(shownGroups === 0 && !showSingleEl.checked){
    app.innerHTML = '<div class="empty">没有符合条件的分组，试试降低“最小组大小”或清空搜索。</div>';
  }
}

[qEl, minEl, showSingleEl].forEach(el => el.addEventListener('input', build));
document.getElementById('expandAll').addEventListener('click', expandAll);
document.getElementById('collapseAll').addEventListener('click', collapseAll);
playBtn.addEventListener('click', togglePlay);
voiceSel.addEventListener('change', onVoiceChange);

// 自测模式：隐藏中文释义
const quizBtn = document.getElementById('quizBtn');
quizBtn.addEventListener('click', () => {
  const on = document.body.classList.toggle('hide-cn');
  quizBtn.classList.toggle('primary', on);
  quizBtn.textContent = on ? '显示中文' : '隐藏中文';
});
build();
